# ============================================================
# Nginx 配置
#
# 职责：
#   1. 托管前端静态文件（HTML/CSS/JS/图片）
#   2. 把 /api 请求转发到后端容器（同源，避免 CORS）
#   3. SSE 关闭代理缓冲（流式响应必须立即推送，不能等缓冲满）
#
# 关键配置说明：
#   - proxy_buffering off：SSE 流式响应必须关闭缓冲，
#     否则 Nginx 会把整段响应攒起来再发，前端就看不到「逐字输出」了
#   - proxy_read_timeout：SSE 长连接不能被默认 60s 超时掐断
#   - SPA fallback：所有非 /api 路径都返回 index.html（Vue Router 前端路由）
# ============================================================

server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：后端 multer 限制 10MB，而 Nginx 默认只有 1MB。
    # 不放宽的话，大于 1MB 的附件会被 Nginx 直接 413 拒掉，
    # 前端表现为「点了上传没反应」（错误响应不是业务 JSON，前端拿不到提示）。
    # 这里留一点余量（12m）给 multipart 的编码开销。
    client_max_body_size 12m;

    # 静态文本资源压缩（HTML/CSS/JS 压缩率很高，首屏明显变快）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 管理后台（独立 SPA，base 为 /admin/）
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 聊天前台 SPA 路由：所有非 /api、非 /admin 的路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（hash 文件名，缓存一年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理 /api 到后端
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        # 必须设置：让后端知道客户端的真实 IP（用于限流）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # ⭐ SSE 关键配置：关闭代理缓冲
        # 不关的话 Nginx 会把流攒起来一次性发，前端看不到逐字输出
        proxy_buffering off;
        proxy_cache off;

        # SSE 长连接：不能被默认 60s 超时掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 禁用压缩（SSE 流式响应压缩会破坏增量推送）
        proxy_set_header Accept-Encoding "";
    }

    # 上传文件访问（消息附件里的 <img src> 指向这里）
    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
