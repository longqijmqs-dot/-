# ============================================================
# 生产环境 Nginx 配置
#
# 职责：
#   1. 托管前端静态文件
#   2. 反向代理 /api → 后端
#   3. SSE 关闭代理缓冲（流式响应必须立即推送）
#   4. HTTPS（生产环境必须）
#
# 部署方式：
#   1. 把此文件放到服务器 /etc/nginx/conf.d/aichat.conf
#   2. 准备 SSL 证书（Let's Encrypt 免费获取）
#   3. nginx -t && nginx -s reload
# ============================================================

server {
    listen 80;
    server_name your-domain.com;

    # HTTP → HTTPS 重定向（生产环境必须）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ---------- SSL 证书 ----------
    ssl_certificate     /etc/nginx/ssl/aichat.crt;
    ssl_certificate_key /etc/nginx/ssl/aichat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 前端静态文件 ----------
    root /var/www/aichat;
    index index.html;

    # SPA 路由：所有非 /api 的路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（hash 文件名，缓存一年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 反向代理 /api → 后端 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递客户端真实 IP（用于限流）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # ⭐ SSE 关键配置：关闭代理缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Accept-Encoding "";
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
